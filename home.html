<h1 style="font-size: 32px; font-weight: bold">Tai Gar</h1>
<p>Tai Gar is a small web browser written in Python with Skia and SDL.</p>
<p>It was built to learn how browsers work by following the Web Browser Engineering book.</p>
<p>It renders with the GPU and falls back to the CPU when the GPU is not available.</p>
<p><a href="https://browser.engineering/">Start reading Web Browser Engineering</a></p>
